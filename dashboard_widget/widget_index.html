<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五金融模型 · 运行健康监控</title>
<style>
  .root { font-family: var(--kimi-font-sans); padding-block-start: var(--kimi-space-4); padding-inline: var(--kimi-space-4); padding-block-end: var(--kimi-space-4); }
  button, input, select, textarea { font: inherit; }
  .hero { font-size: 28px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .card { border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-3) var(--kimi-space-4); }
  .grid5 { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: var(--kimi-space-3); }
  .gname { font-size: 14px; font-weight: 500; }
  .gsym { font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: var(--kimi-radius-full); margin-right: 6px; vertical-align: 1px; }
  table.syms { width: 100%; border-collapse: collapse; }
  table.syms th, table.syms td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--kimi-color-border); font-size: 13px; }
  table.syms th { font-weight: 500; }
  table.syms td.n { font-variant-numeric: tabular-nums; }
  table.syms tr:last-child td { border-bottom: none; }
</style>
</head>
<body>
<div class="root kimi-stack" style="gap: var(--kimi-space-4);">

  <div class="kimi-row" style="justify-content: space-between; align-items: baseline;">
    <span class="kimi-page-title">五金融模型 · 运行健康监控</span>
    <span class="kimi-meta" id="ts">—</span>
  </div>

  <div class="card">
    <div class="kimi-row" style="justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--kimi-space-2);">
      <div class="kimi-row" style="align-items: baseline; gap: var(--kimi-space-3);">
        <span class="hero" id="ovText">—</span>
        <span class="kimi-status" id="ovStatus">—</span>
      </div>
      <span class="kimi-meta" id="svcMeta">—</span>
    </div>
  </div>

  <div class="grid5" id="groups"></div>

  <div class="card">
    <div class="kimi-section-title" style="font-size: 15px; margin-bottom: var(--kimi-space-2);">逐品种状态</div>
    <table class="syms">
      <thead><tr>
        <th>品种</th><th>状态</th><th>最近评估</th><th>主要拦截原因</th>
      </tr></thead>
      <tbody id="symRows"></tbody>
    </table>
  </div>

  <div class="card">
    <div class="kimi-row" style="justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--kimi-space-2);">
      <span class="kimi-section-title" style="font-size: 15px;">IB Gateway 纸交易通道</span>
      <span class="kimi-status" id="ibkrStatus">—</span>
    </div>
  </div>

  <div class="kimi-row" style="justify-content: space-between; align-items: center;">
    <span class="kimi-meta">纸交易 · 仅模拟账户</span>
    <button class="kimi-button kimi-button--secondary" id="refresh">立即刷新</button>
  </div>

</div>

<script>
(function () {
  var SAMPLE = {
    generated_at: "2026-08-29 19:40",
    overall: "LIVE",
    service: { running: true, state: "running", pid: 99883, source: "launchd", heartbeat_age_s: 24.8, halted: false },
    ibkr: { port_open: true, port: 4002 },
    groups: [
      { name: "CRYPTO", status: "LIVE", symbols: "BTC" },
      { name: "FX", status: "LIVE", symbols: "EURUSD, USDJPY" },
      { name: "INDEX", status: "LIVE", symbols: "MES, MNQ" },
      { name: "OIL", status: "LIVE", symbols: "CL" },
      { name: "TREASURY", status: "LIVE", symbols: "ZT, ZN, SR3" }
    ],
    symbols: [
      { name: "BTC", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "EURUSD", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "USDJPY", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "MES", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "MNQ", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "CL", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "ZT", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "ZN", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" },
      { name: "SR3", status: "LIVE", last_eval_age: "<1m", top_reason: "no_active_event" }
    ]
  };

  var GROUP_CN = { CRYPTO: "加密货币", FX: "外汇", INDEX: "股指", OIL: "原油", TREASURY: "国债" };

  // Delivery smoke host guards: no onDataChange/emit there, DOM queries return undefined.
  function byId(id) {
    try {
      return (typeof document !== "undefined" && typeof document.getElementById === "function")
        ? document.getElementById(id) : null;
    } catch (e) { return null; }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function statusClass(s) {
    if (s === "LIVE") return "kimi-status kimi-status--positive";
    if (s === "LIVE_WITH_WARNINGS" || s === "ATTENTION" || s === "HALTED") return "kimi-status kimi-status--warning";
    return "kimi-status kimi-status--danger";
  }
  function statusText(s) {
    return { LIVE: "运行中", LIVE_WITH_WARNINGS: "有告警", ATTENTION: "需关注", HALTED: "已暂停",
             INTERRUPTED: "已中断", NOT_CONFIGURED: "未配置", UNKNOWN: "未知" }[s] || s;
  }

  function render(d) {
    var groupsEl = byId("groups");
    if (!groupsEl) return; // smoke host: no live DOM
    if (!d || !Array.isArray(d.groups)) d = SAMPLE;
    var el;

    if ((el = byId("ts"))) el.textContent = d.generated_at ? "更新 " + d.generated_at : "";

    var ov = d.overall || "UNKNOWN";
    if ((el = byId("ovText"))) el.textContent = statusText(ov);
    if ((el = byId("ovStatus"))) { el.className = statusClass(ov); el.textContent = ov; }

    var svc = d.service || {};
    var svcParts = [];
    if (svc.source) svcParts.push("托管: " + svc.source);
    if (typeof svc.heartbeat_age_s === "number") svcParts.push("心跳 " + svc.heartbeat_age_s + "s 前");
    if (svc.halted) svcParts.push("halted=true");
    if ((el = byId("svcMeta"))) el.textContent = svcParts.join(" · ") || "—";

    groupsEl.innerHTML = d.groups.map(function (g) {
      return '<div class="card">'
        + '<div class="kimi-row" style="justify-content: space-between; align-items: center;">'
        + '<span class="gname">' + esc(GROUP_CN[g.name] || g.name) + '</span>'
        + '<span class="' + statusClass(g.status) + '">' + esc(statusText(g.status)) + '</span></div>'
        + '<div class="kimi-meta gsym" style="margin-top: var(--kimi-space-1);">' + esc(g.symbols || "") + '</div>'
        + '</div>';
    }).join("");

    var tbody = byId("symRows");
    if (tbody && Array.isArray(d.symbols)) {
      tbody.innerHTML = d.symbols.map(function (s) {
        return "<tr>"
          + "<td><b>" + esc(s.name) + "</b></td>"
          + '<td><span class="' + statusClass(s.status) + '">' + esc(statusText(s.status)) + "</span></td>"
          + '<td class="n">' + esc(s.last_eval_age || "—") + "</td>"
          + '<td class="kimi-meta">' + esc(s.top_reason || "—") + "</td>"
          + "</tr>";
      }).join("");
    }

    var ib = d.ibkr || {};
    var ibEl = byId("ibkrStatus");
    if (ibEl) {
      if (ib.port_open) {
        ibEl.className = "kimi-status kimi-status--positive";
        ibEl.textContent = "端口 " + (ib.port || 4002) + " 已连接";
      } else {
        ibEl.className = "kimi-status kimi-status--danger";
        ibEl.textContent = "端口 " + (ib.port || 4002) + " 不可达";
      }
    }
  }

  var btn = byId("refresh");
  function setBusy(b) { if (btn) { btn.disabled = b; btn.textContent = b ? "刷新中…" : "立即刷新"; } }

  var host = (typeof window !== "undefined") ? window.DaimonWidget : null;

  if (btn) {
    btn.addEventListener("click", function () {
      if (!host || typeof host.emit !== "function") return;
      setBusy(true);
      host.emit("submit", {});
    });
  }

  if (host && typeof host.onDataChange === "function") {
    render(host.data && host.data.main);
    var off = host.onDataChange(function (data) { setBusy(false); render(data && data.main); });
    var off2 = (typeof host.onStatusChange === "function") ? host.onStatusChange(function () {
      if (host.status !== "running") setBusy(false);
    }) : null;
    if (typeof window.addEventListener === "function") {
      window.addEventListener("pagehide", function () { off && off(); off2 && off2(); });
    }
  } else if (!host) {
    render(SAMPLE); // standalone preview without host runtime
  }
  // Smoke host (host present, no onDataChange): intentionally render nothing.
})();
</script>
</body>
</html>
